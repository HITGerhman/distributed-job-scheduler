global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/prometheus-rules.yml

scrape_configs:
  - job_name: djs-master
    static_configs:
      - targets:
          - host.docker.internal:18080
        labels:
          service: djs
          role: master

  - job_name: djs-worker
    static_configs:
      - targets:
          - host.docker.internal:19080
        labels:
          service: djs
          role: worker
